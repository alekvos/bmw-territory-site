<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Синий спортивный седан BMW</title>
  <desc id="desc">Цельный профиль современного синего седана BMW</desc>
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2=".8">
      <stop offset="0" stop-color="#06223e"/>
      <stop offset=".2" stop-color="#0d63ad"/>
      <stop offset=".43" stop-color="#1599e0"/>
      <stop offset=".68" stop-color="#0870bd"/>
      <stop offset=".86" stop-color="#054277"/>
      <stop offset="1" stop-color="#021426"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#38b1ed"/>
      <stop offset=".48" stop-color="#0874c2"/>
      <stop offset="1" stop-color="#04315f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#385f78"/>
      <stop offset=".3" stop-color="#132c3c"/>
      <stop offset="1" stop-color="#030a10"/>
    </linearGradient>
    <radialGradient id="tire">
      <stop offset="0" stop-color="#67727d"/>
      <stop offset=".2" stop-color="#18212a"/>
      <stop offset=".65" stop-color="#2b333c"/>
      <stop offset=".72" stop-color="#080a0d"/>
      <stop offset="1" stop-color="#010203"/>
    </radialGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff"/>
      <stop offset=".5" stop-color="#c5efff"/>
      <stop offset="1" stop-color="#56c5ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <style>
      .wheel-spin { transform-box: fill-box; transform-origin: center; animation: wheel-in 1.35s .35s cubic-bezier(.16,1,.3,1) both; }
      @keyframes wheel-in { from { transform: rotate(-500deg); } to { transform: rotate(0); } }
      @media (prefers-reduced-motion: reduce) { .wheel-spin { animation: none; } }
    </style>
  </defs>

  <ellipse cx="620" cy="455" rx="500" ry="28" fill="#164d70" opacity=".2" filter="url(#shadow)"/>
  <path d="M104 437c131-24 304-34 520-33 216 1 378 12 477 34-105 24-273 35-500 33-216-1-382-12-497-34Z" fill="#122633" opacity=".34"/>

  <g id="car">
    <!-- One continuous body shell -->
    <path d="M82 356c15-48 58-78 131-94l154-34c66-69 145-103 247-103 101 0 187 33 264 99l177 39c55 12 89 40 101 83l-17 43-112 8c-9-68-46-103-102-103-57 0-94 36-103 105H401c-9-69-48-105-105-105-58 0-96 36-105 105l-77-7c-33-3-49-17-43-43l11-43Z" fill="url(#paint)" stroke="#075d9f" stroke-width="2"/>
    <path d="M115 319c227-47 552-52 958-16 35 3 61 14 80 32l3 11-17 43-112 8c-9-68-46-103-102-103-57 0-94 36-103 105H401c-9-69-48-105-105-105-58 0-96 36-105 105l-77-7c-33-3-49-17-43-43l11-43 33-7Z" fill="url(#side)" opacity=".96"/>

    <!-- Cabin locked to the roof line -->
    <path d="M370 228c64-67 142-98 242-98 95 0 177 31 250 94l-257 7-235-3Z" fill="#08213a" stroke="#58b4e6" stroke-opacity=".52" stroke-width="2"/>
    <path d="M405 216c52-49 111-72 184-75l-4 78-180-3Z" fill="url(#glass)"/>
    <path d="M611 140c78 2 146 27 207 76l-211 4 4-80Z" fill="url(#glass)"/>
    <path d="M599 132l-2 96" stroke="#02080e" stroke-width="12"/>
    <path d="M370 229c162 9 326 6 492-5" fill="none" stroke="#a2e0ff" stroke-opacity=".62" stroke-width="3"/>
    <path d="M814 213l33 17-23 18-32-8 22-27Z" fill="#062039" stroke="#319bd4" stroke-width="2"/>

    <!-- Body details all follow the same perspective line -->
    <path d="M118 307c228-44 548-47 948-12" fill="none" stroke="#a1e4ff" stroke-opacity=".34" stroke-width="4"/>
    <path d="M410 238c-7 53-8 101-3 145m232-148c2 55 8 104 17 148" fill="none" stroke="#032344" stroke-opacity=".75" stroke-width="3"/>
    <path d="M480 255h50M704 250h50" stroke="#b9e6f7" stroke-width="4" stroke-linecap="round"/>
    <path d="M427 340c130 14 261 14 392 0" fill="none" stroke="#7fcaf0" stroke-opacity=".32" stroke-width="3"/>
    <path d="M427 379h375" stroke="#04182d" stroke-opacity=".55" stroke-width="4"/>

    <!-- Rear and front lighting integrated inside the body -->
    <path d="M121 288c38-11 77-19 116-24l-9 29-107 16v-21Z" fill="#9f1831"/>
    <path d="M130 285l91-14" stroke="#ff647b" stroke-width="5" stroke-linecap="round"/>
    <path d="M1019 282c47 8 86 20 116 37l-5 28-115-17 4-48Z" fill="#06192c"/>
    <path d="M1031 292c36 6 68 15 95 28l-7 15-89-13 1-30Z" fill="url(#lamp)"/>
    <path d="M1040 306c27 4 51 10 72 18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

    <!-- BMW kidney grille contained within the nose -->
    <g transform="translate(1092 349) skewX(-5)">
      <rect x="-35" y="-13" width="29" height="43" rx="11" fill="#07111a" stroke="#8aa8ba" stroke-width="2"/>
      <rect x="1" y="-13" width="29" height="43" rx="11" fill="#07111a" stroke="#8aa8ba" stroke-width="2"/>
      <path d="M-27-4v25M-19-5v27M9-4v25M17-5v27" stroke="#536c7e" stroke-width="3"/>
    </g>
    <path d="M1028 371c43 7 78 9 108 8l-8 12-101 6" fill="#031322"/>
    <path d="M1072 403h64l-12 13h-72Z" fill="#061522" stroke="#337ba5" stroke-width="2"/>

    <!-- Bonnet badge and subtle M accent -->
    <g transform="translate(935 256)">
      <circle r="14" fill="#eef7fb" stroke="#122431" stroke-width="3"/>
      <path d="M0-11V0h11A11 11 0 0 0 0-11ZM0 0v11A11 11 0 0 0 11 0Z" fill="#0877cf"/>
    </g>
    <path d="M850 411h31" stroke="#62c9ed" stroke-width="4"/><path d="M884 411h19" stroke="#1265b4" stroke-width="4"/><path d="M906 411h13" stroke="#d83358" stroke-width="4"/>

    <!-- Wheels share exact centers with their matching arches -->
    <g transform="translate(296 390)">
      <circle r="86" fill="url(#tire)"/>
      <circle r="60" fill="#111922" stroke="#81909b" stroke-width="2"/>
      <g class="wheel-spin" fill="#aab4bd">
        <path d="M-6-53h12l9 42L0 0Z"/><path d="M-6-53h12l9 42L0 0Z" transform="rotate(45)"/>
        <path d="M-6-53h12l9 42L0 0Z" transform="rotate(90)"/><path d="M-6-53h12l9 42L0 0Z" transform="rotate(135)"/>
        <path d="M-6-53h12l9 42L0 0Z" transform="rotate(180)"/><path d="M-6-53h12l9 42L0 0Z" transform="rotate(225)"/>
        <path d="M-6-53h12l9 42L0 0Z" transform="rotate(270)"/><path d="M-6-53h12l9 42L0 0Z" transform="rotate(315)"/>
      </g>
      <circle r="19" fill="#0877cf" stroke="#edf7fb" stroke-width="3"/>
      <path d="M0-15V0h15A15 15 0 0 0 0-15ZM0 0v15A15 15 0 0 0 15 0Z" fill="#fff" opacity=".9"/>
    </g>
    <g transform="translate(925 390)">
      <circle r="86" fill="url(#tire)"/>
      <circle r="60" fill="#111922" stroke="#81909b" stroke-width="2"/>
      <g class="wheel-spin" fill="#aab4bd">
        <path d="M-6-53h12l9 42L0 0Z"/><path d="M-6-53h12l9 42L0 0Z" transform="rotate(45)"/>
        <path d="M-6-53h12l9 42L0 0Z" transform="rotate(90)"/><path d="M-6-53h12l9 42L0 0Z" transform="rotate(135)"/>
        <path d="M-6-53h12l9 42L0 0Z" transform="rotate(180)"/><path d="M-6-53h12l9 42L0 0Z" transform="rotate(225)"/>
        <path d="M-6-53h12l9 42L0 0Z" transform="rotate(270)"/><path d="M-6-53h12l9 42L0 0Z" transform="rotate(315)"/>
      </g>
      <circle r="19" fill="#0877cf" stroke="#edf7fb" stroke-width="3"/>
      <path d="M0-15V0h15A15 15 0 0 0 0-15ZM0 0v15A15 15 0 0 0 15 0Z" fill="#fff" opacity=".9"/>
    </g>

    <!-- Precisely matched fender lips drawn last -->
    <path d="M204 398a92 92 0 0 1 184 0" fill="none" stroke="#03213b" stroke-width="10"/>
    <path d="M833 398a92 92 0 0 1 184 0" fill="none" stroke="#03213b" stroke-width="10"/>
  </g>
</svg>
