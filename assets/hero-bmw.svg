<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Синий спортивный седан BMW</title>
  <desc id="desc">Современный синий BMW в динамичном ракурсе три четверти</desc>
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2=".72">
      <stop offset="0" stop-color="#07182b"/>
      <stop offset=".22" stop-color="#124f91"/>
      <stop offset=".46" stop-color="#168dd8"/>
      <stop offset=".63" stop-color="#07599f"/>
      <stop offset=".84" stop-color="#043366"/>
      <stop offset="1" stop-color="#020a15"/>
    </linearGradient>
    <linearGradient id="paintTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#73d2ff"/>
      <stop offset=".18" stop-color="#167fc9"/>
      <stop offset=".72" stop-color="#07366d"/>
      <stop offset="1" stop-color="#04152b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#284860"/>
      <stop offset=".38" stop-color="#0d1d2a"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <radialGradient id="tire">
      <stop offset="0" stop-color="#79838c"/>
      <stop offset=".17" stop-color="#121820"/>
      <stop offset=".6" stop-color="#303842"/>
      <stop offset=".68" stop-color="#06080b"/>
      <stop offset="1" stop-color="#010203"/>
    </radialGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff"/>
      <stop offset=".45" stop-color="#bdecff"/>
      <stop offset="1" stop-color="#38aeff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .wheel-spokes { transform-box: fill-box; transform-origin: center; animation: wheel-arrival 1.35s .35s cubic-bezier(.16,1,.3,1) both; }
      @keyframes wheel-arrival { from { transform: rotate(-500deg); } to { transform: rotate(0); } }
      @media (prefers-reduced-motion: reduce) { .wheel-spokes { animation: none; } }
    </style>
  </defs>

