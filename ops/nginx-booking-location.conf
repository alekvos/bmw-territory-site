# Place this block inside the bmw-territory.ru HTTPS server block.
location = /api/booking {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787/api/booking;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
}

# Local-only health endpoint for deployment checks; do not expose it publicly.
location = /internal/booking-health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8787/health;
    proxy_set_header Host $host;
}
